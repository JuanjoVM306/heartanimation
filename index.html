<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Heart Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .viewport-container {
      width: 100vw;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Escalador ajustado para el centro geométrico de la pantalla */
    .heart-scaler {
      width: 350px;
      height: 350px;
      position: absolute;
      top: 50%;
      left: 50%;
      /* Se agrega un ligero offset en Y (-5px) para compensar el peso visual del vértice inferior */
      transform: translate(-50%, calc(-50% - 5px)) scale(calc(min(80vw, 55vh) / 350));
      transform-origin: center center;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #ui {
      position: relative;
      width: 350px;
      height: 350px;
    }

    #ui .love {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(0, 0);
      --i: 1;
    }

    #ui .love_horizontal {
      animation: horizontal 10s infinite alternate ease-in-out;
      animation-delay: calc(var(--i) * -300ms);
    }

    #ui .love_vertical {
      animation: vertical 20s infinite linear;
      animation-delay: calc(var(--i) * -300ms);
    }

    #ui .love_word {
      color: #ea80b0;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1px;
      white-space: nowrap;
      text-shadow: 0 0 6px #fff, 0 0 15px #ea80b0;
      transform: translateY(-100%) rotate(-30deg);
      user-select: none;
    }

    @keyframes horizontal {
      from {
        transform: translateX(-175px);
      }
      to {
        transform: translateX(175px);
      }
    }

    @keyframes vertical {
      0% { transform: translateY(-30px); }
      10% { transform: translateY(-135px); }
      15% { transform: translateY(-165px); }
      18% { transform: translateY(-170px); }
      20% { transform: translateY(-165px); }
      22% { transform: translateY(-140px); }
      24% { transform: translateY(-115px); }
      25% { transform: translateY(-75px); }
      26% { transform: translateY(-115px); }
      28% { transform: translateY(-140px); }
      30% { transform: translateY(-165px); }
      32% { transform: translateY(-170px); }
      35% { transform: translateY(-165px); }
      40% { transform: translateY(-135px); }
      50% { transform: translateY(-30px); }
      71% { transform: translateY(140px); }
      72.5% { transform: translateY(155px); }
      75% { transform: translateY(165px); }
      77.5% { transform: translateY(155px); }
      79% { transform: translateY(140px); }
      100% { transform: translateY(-30px); }
    }
  </style>
</head>
<body>

  <div class="viewport-container">
    <div class="heart-scaler">
      <div id="ui"></div>
    </div>
  </div>

  <script>
    const ui = document.getElementById("ui");
    const totalItems = 80;

    for (let i = 1; i <= totalItems; i++) {
      const love = document.createElement("div");
      love.className = "love";
      love.style.setProperty("--i", i);
      love.innerHTML = `
        <div class="love_horizontal">
          <div class="love_vertical">
            <div class="love_word">I love you</div>
          </div>
        </div>
      `;
      ui.appendChild(love);
    }
  </script>
</body>
</html>
