<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Heart Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .viewport-container {
      width: 283px;
      height: 612px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    /* Escalador centrado para el ancho de 283px */
    .heart-scaler {
      width: 350px;
      height: 350px;
      position: absolute;
      top: 50%;
      left: 43%;
      /* Escala 0.55 + traslado centrado simétrico */
      transform: translate(-50%, -50%) scale(0.46);
      transform-origin: center center;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #ui {
      position: relative;
      width: 350px;
      height: 350px;
    }

    #ui .love {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(0, 0);
      --i: 1;
    }

    #ui .love_horizontal {
      animation: horizontal 10s infinite alternate ease-in-out;
      animation-delay: calc(var(--i) * -300ms);
    }

    #ui .love_vertical {
      animation: vertical 20s infinite linear;
      animation-delay: calc(var(--i) * -300ms);
    }

    #ui .love_word {
      color: #ea80b0;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 1px;
      white-space: nowrap;
      text-shadow: 0 0 6px #fff, 0 0 15px #ea80b0;
      transform: translateY(-100%) rotate(-30deg);
      user-select: none;
    }

    /* Recorrido simétrico de izquierda a derecha (-225px a +225px) */
    @keyframes horizontal {
      from {
        transform: translateX(-225px);
      }
      to {
        transform: translateX(225px);
      }
    }

    /* Trayectoria vertical del corazón centrada en el eje */
    @keyframes vertical {
      0% { transform: translateY(0px); }
      10% { transform: translateY(-135px); }
      15% { transform: translateY(-175.5px); }
      18% { transform: translateY(-180px); }
      20% { transform: translateY(-175.5px); }
      22% { transform: translateY(-145.38px); }
      24% { transform: translateY(-115.71px); }
      25% { transform: translateY(-67.5px); }
      26% { transform: translateY(-115.71px); }
      28% { transform: translateY(-145.38px); }
      30% { transform: translateY(-175.5px); }
      32% { transform: translateY(-180px); }
      35% { transform: translateY(-175.5px); }
      40% { transform: translateY(-135px); }
      50% { transform: translateY(0px); }
      71% { transform: translateY(248.57px); }
      72.5% { transform: translateY(261.17px); }
      75% { transform: translateY(270px); }
      77.5% { transform: translateY(261.17px); }
      79% { transform: translateY(248.57px); }
      100% { transform: translateY(0px); }
    }
  </style>
</head>
<body>

  <div class="viewport-container">
    <div class="heart-scaler">
      <div id="ui"></div>
    </div>
  </div>

  <script>
    const ui = document.getElementById("ui");
    const totalItems = 100;

    for (let i = 1; i <= totalItems; i++) {
      const love = document.createElement("div");
      love.className = "love";
      love.style.setProperty("--i", i);
      love.innerHTML = `
        <div class="love_horizontal">
          <div class="love_vertical">
            <div class="love_word">I love you</div>
          </div>
        </div>
      `;
      ui.appendChild(love);
    }
  </script>
</body>
</html>
